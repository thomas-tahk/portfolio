<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Thomas Tahk: IT support by day, software developer on my own time. Projects, experience and contact." />
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
        // Palette previews: only on preview builds or with ?palette= (never production).
        var q = /[?&]palette=([a-z]+)/.exec(location.search)
        if (location.pathname.indexOf('/preview/') > -1 || q) {
          var p = q && q[1]
          if (!p) { try { p = localStorage.getItem('palette') } catch (e) {} }
          if (['ember', 'forest', 'grape', 'cherry'].indexOf(p) > -1) {
            document.documentElement.setAttribute('data-palette', p)
            try { localStorage.setItem('palette', p) } catch (e) {}
          }
        }
      })()
    </script>
    <title>Thomas Tahk | Developer</title>
  </head>
  <body>
    <div id="home"></div>
    <script type="module" src="/src/home/main.jsx"></script>
  </body>
</html>
