<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')</script>
  <title>Thomas Tahk — layout studies</title>
</head>
<body class="study" data-layout="editorial">
  <div id="home"></div>
  <footer class="photo-credit">Seoraksan photograph by <a href="https://commons.wikimedia.org/wiki/File:Seoraksan_National_Park_(187188929).jpeg">Eirien</a>, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>. Faded and cropped.</footer>
  <aside class="layout-switcher" aria-label="Prototype layout comparison">
    <span>Layout study</span>
    <div role="group" aria-label="Choose layout">
      <button type="button" data-layout-choice="editorial">Editorial</button>
      <button type="button" data-layout-choice="split">Split profile</button>
      <button type="button" data-layout-choice="work">Work first</button>
    </div>
    <p class="layout-description" aria-live="polite"></p>
  </aside>
  <script type="module" src="./src/studies/plainAtmosphere.js"></script>
</body>
</html>
